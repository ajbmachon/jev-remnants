name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    name: test (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - name: Install uv, ast-grep and ripgrep
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install ast-grep-cli
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest
